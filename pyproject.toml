[project]
name = "texloom"
version = "0.1.0"
description = "Local-first collaborative LaTeX: relay server and folder-sync daemon"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
    "pycrdt>=0.14.13",
    "watchfiles>=1.3.0",
]

[project.scripts]
texloom = "texloom.cli:main"
texloom-server = "server.relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["texloom", "server"]
