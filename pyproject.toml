[project]
name = "texloom"
version = "0.4.10"
description = "Local-first collaborative LaTeX: folder sync, MCP server for agents, and the relay server"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "cryptography>=50.0.2",
    "pycrdt>=0.14.13",
    "truststore>=0.10.5",
    "watchfiles>=1.3.0",
]

[project.scripts]
texloom = "texloom.cli:main"
texloom-server = "server.relay:main"

[project.gui-scripts]
texloom-app = "texloom.app:main"

[project.optional-dependencies]
app = [
    "pyside6-essentials>=6.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["texloom", "server"]
