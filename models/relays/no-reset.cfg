\* Violated: Converged. A relay that keeps its `upto` from before a failover drops changes numbered afresh.
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS TypeOK NoLostAck Converged
CONSTRAINT Bounded
CONSTANTS Apps = {a1, a2}  Relays = {r1, r2}  MaxChanges = 2
          MaxCrashes = 0  MaxFailovers = 1  MaxBreaks = 0
          AckAfterPublish = TRUE  Recheck = TRUE  ResetOnTimeline = FALSE  StoreAgain = TRUE  TimelineOnBus = TRUE
