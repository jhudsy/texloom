\* Holds. The old order (acknowledge, then pass on): stored changes still reach everyone,
\* through the head check; the new order is about how soon, which this model doesn't measure.
SPECIFICATION Spec
SYMMETRY Symmetry
INVARIANTS TypeOK NoLostAck Converged
CONSTRAINT Bounded
CONSTANTS Apps = {a1, a2}  Relays = {r1, r2}  MaxChanges = 2
          MaxCrashes = 1  MaxFailovers = 0  MaxBreaks = 0
          AckAfterPublish = FALSE  Recheck = TRUE  ResetOnTimeline = TRUE  StoreAgain = TRUE  TimelineOnBus = TRUE
