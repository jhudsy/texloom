\* A server can be frozen with its clock stopped (a suspended virtual machine), so it can wake and write
\* after the standby took over. Two writers can then overlap (freeze-writers.cfg), but the app that was
\* told "stored" by the old one loses nothing: the hello check sends it again to the new primary.
SPECIFICATION Spec
CONSTANTS TTL = 2  TakeoverWait = 4  MaxRate = 2  MaxTime = 10  MaxChanges = 2
          FreezeStopsClock = TRUE  HelloChecks = TRUE
INVARIANTS TypeOK NoLostAck
