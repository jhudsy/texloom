\* EXPECTED TO FAIL: a frozen server whose clock stopped wakes and writes while the standby, which took
\* over, writes too. Not preventable by timers alone: what keeps it harmless is the hello check
\* (freeze-heals.cfg), and what keeps it short is that the first renewal after waking fences it.
SPECIFICATION Spec
CONSTANTS TTL = 2  TakeoverWait = 4  MaxRate = 2  MaxTime = 10  MaxChanges = 1
          FreezeStopsClock = TRUE  HelloChecks = TRUE
INVARIANTS SingleWriter
