# Sync-only projects between two computers, end to end (scripts/check_synconly.py), on each
# operating system: desktop with desktop, and desktop with the web app (headless Chromium typing for
# real). The script simulates Windows and Unix line endings, and the Windows runner adds a real
# Windows. No TeX files here, so the web app doesn't compile (⌘S is still checked). A few minutes,
# so it runs only when what it checks may have changed, every night, and on demand
# (Actions → Sync-only check → Run workflow). On a pull request that changes only the server's side
# (server/, the checks' database helpers) the operating systems don't matter, because the server
# only runs on Linux: that run is Ubuntu alone. Anything on a computer's side (the desktop app, the
# web app's sync code, the checks themselves) runs on all three, as does every push to main, every
# night and every manual run.
name: Sync-only check

on:
  push:
    branches: [main]
    paths:
      - 'texloom/**'
      - 'server/**'
      - 'scripts/check_synconly.py'
      - 'scripts/check_shared_folder.py'
      - 'scripts/checklib.py'
      - 'scripts/testdb.py'
      - 'scripts/pg.py'
      - 'scripts/refuse_writes/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/sync-only.yml'
      - '.github/actions/web/**'
      - '.github/actions/chromium/**'
      - 'web/src/replica.ts'
      - 'web/src/editor.ts'
      - 'web/src/foldersync.ts'
      - 'web/src/projectfiles.ts'
      - 'web/src/output.ts'
      - 'web/src/compile.ts'
      - 'web/src/diff.ts'
      - 'web/src/wholechars.ts'
      - 'web/src/crypto.ts'
      - 'web/package-lock.json'
  pull_request:
    paths:
      - 'texloom/**'
      - 'server/**'
      - 'scripts/check_synconly.py'
      - 'scripts/check_shared_folder.py'
      - 'scripts/checklib.py'
      - 'scripts/testdb.py'
      - 'scripts/pg.py'
      - 'scripts/refuse_writes/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/sync-only.yml'
      - '.github/actions/web/**'
      - '.github/actions/chromium/**'
      - 'web/src/replica.ts'
      - 'web/src/editor.ts'
      - 'web/src/foldersync.ts'
      - 'web/src/projectfiles.ts'
      - 'web/src/output.ts'
      - 'web/src/compile.ts'
      - 'web/src/diff.ts'
      - 'web/src/wholechars.ts'
      - 'web/src/crypto.ts'
      - 'web/package-lock.json'
  schedule:
    - cron: '17 3 * * *'  # nightly
  workflow_dispatch:

jobs:
  scope:
    name: Which systems
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # what only a computer's own side can change: the desktop app, the web app, these checks
          ours='^(texloom/|web/|scripts/(check_synconly|check_shared_folder|checklib)\.py|scripts/refuse_writes/|pyproject\.toml|uv\.lock|\.github/(workflows/sync-only\.yml|actions/))'
          changed=$(git diff --name-only "$BASE"...HEAD)  # (not piped into grep -q: under pipefail its early exit would flip the answer)
          if [ "$EVENT" = pull_request ] && ! grep -qE "$ours" <<< "$changed"; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
            echo "Only the server's side changed: Ubuntu alone"
          else
            echo 'os=["ubuntu-latest","windows-latest","macos-latest"]' >> "$GITHUB_OUTPUT"
          fi
  sync-only:
    needs: scope
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.scope.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/web  # npm ci, and web/dist built: the server serves it
      - name: Chromium for the web app's pairings
        uses: ./.github/actions/chromium
      - run: uv run --extra server --with playwright python scripts/check_synconly.py
        env:
          CHECK_DIR: ${{ runner.temp }}/synconly
      - name: A folder two computers also share through a file-sync service (Dropbox and the like)
        if: success() || failure()
        run: uv run --extra server python scripts/check_shared_folder.py
        env:
          CHECK_DIR: ${{ runner.temp }}/shared-folder
      - name: Desktop pairings with 30% of file writes refused (as on Windows when a file is open elsewhere)
        if: runner.os == 'Linux'
        run: uv run --extra server python scripts/check_synconly.py unix/unix windows/unix
        env:
          CHECK_DIR: ${{ runner.temp }}/synconly-refused
          CHECK_REFUSE_WRITES: '0.3'
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synconly-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/synconly
            ${{ runner.temp }}/synconly-refused
            ${{ runner.temp }}/shared-folder
          include-hidden-files: true
