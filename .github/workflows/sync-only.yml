# Sync-only projects between two computers, end to end (scripts/check_synconly.py), on each
# operating system: the script simulates Windows and Unix line endings, and the Windows runner adds a
# real Windows. A few minutes, so it runs only when what it checks may have changed (the desktop
# app's sync, the server), every night, and on demand (Actions → Sync-only check → Run workflow).
name: Sync-only check

on:
  push:
    branches: [main]
    paths:
      - 'texloom/**'
      - 'server/**'
      - 'scripts/check_synconly.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/sync-only.yml'
  pull_request:
    paths:
      - 'texloom/**'
      - 'server/**'
      - 'scripts/check_synconly.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/sync-only.yml'
  schedule:
    - cron: '17 3 * * *'  # nightly
  workflow_dispatch:

jobs:
  sync-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/check_synconly.py
        env:
          CHECK_DIR: ${{ runner.temp }}/synconly
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synconly-${{ matrix.os }}
          path: ${{ runner.temp }}/synconly
          include-hidden-files: true
