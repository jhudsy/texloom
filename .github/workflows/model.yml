# The failover model (models/failover, scripts/check_model.py, issue 8): the TLA+ model checker over
# the lease, the standby and the apps' hello check. Half a minute, so it runs when the model or its
# runner changes, and every week (the pinned checker is fetched and verified each time).
name: Failover model
on:
  push:
    branches: [main]
    paths:
      - 'models/**'
      - 'scripts/check_model.py'
      - 'scripts/checklib.py'
      - '.github/workflows/model.yml'
  pull_request:
    paths:
      - 'models/**'
      - 'scripts/check_model.py'
      - 'scripts/checklib.py'
      - '.github/workflows/model.yml'
  schedule:
    - cron: '23 4 * * 1'  # Mondays
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - run: uv run python scripts/check_model.py
