# Builds the downloadable TeXLoom app for macOS, Windows and Linux.
# Run by hand (Actions → App builds → Run workflow) to get the builds as artifacts, or push
# a tag like v0.3.0 to also attach them to a GitHub release.
name: App builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple silicon
            asset: TeXLoom-macos-arm64.zip
          - os: windows-latest
            asset: TeXLoom-windows-x64.zip
          - os: ubuntu-22.04      # built on an older glibc so it runs on more distributions
            asset: TeXLoom-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Qt's system libraries (Linux)
        if: runner.os == 'Linux'
        # Ubuntu's own archive after the runner's mirror (which has had outages), and a few tries
        run: |
          echo "http://archive.ubuntu.com/ubuntu/	priority:9" | sudo tee -a /etc/apt/apt-mirrors.txt
          for i in 1 2 3; do
            sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 \
              libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 && exit 0
            sleep 30
          done
          exit 1
      - run: uv sync --extra app
      - run: uv run python scripts/licences.py  # the licences of exactly what's bundled, for the About box
      - name: Check that the app starts
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
          TEXLOOM_HOME: ${{ runner.temp }}/texloom-home
        run: uv run python -c "import texloom.app"
      - name: Build
        run: uv run --with pyinstaller --with pillow pyinstaller --noconfirm packaging/texloom-app.spec
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent TeXLoom.app ${{ matrix.asset }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/TeXLoom -DestinationPath dist/${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/${{ matrix.asset }} TeXLoom
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
