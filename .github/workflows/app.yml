# Builds the downloadable TeXLoom app for macOS, Windows and Linux.
# Run by hand (Actions → App builds → Run workflow) to get the builds as artifacts, or push
# a tag like v0.3.0 to also attach them to a GitHub release.
name: App builds

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]*"]  # app releases (v0.4.52); not the VS Code extension's vscode-v* tags

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest      # Apple silicon
            asset: TeXLoom-macos-arm64.zip
          - os: windows-latest
            asset: TeXLoom-windows-x64.zip
          - os: ubuntu-22.04      # built on an older glibc so it runs on more distributions
            asset: TeXLoom-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: ./.github/actions/qt-libs
      - run: uv sync --extra app
      - run: uv run python scripts/licences.py  # the licences of exactly what's bundled, for the About box
      - name: Check the app's windows (on macOS, with the menu bar and the Dock)
        shell: bash
        run: uv run python scripts/check_app.py ${{ runner.os == 'macOS' && '--native' || '' }}
      - name: Build
        run: uv run --with pyinstaller --with pillow pyinstaller --noconfirm packaging/texloom-app.spec
      - name: Check the built app serves MCP (people connect AI tools with it)
        shell: bash
        run: uv run python scripts/check_bundled_mcp.py ${{ runner.os == 'macOS' && 'dist/TeXLoom.app/Contents/MacOS/TeXLoom' || runner.os == 'Windows' && 'dist/TeXLoom/TeXLoom.exe' || 'dist/TeXLoom/TeXLoom' }}
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd dist && ditto -c -k --keepParent TeXLoom.app ${{ matrix.asset }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/TeXLoom -DestinationPath dist/${{ matrix.asset }}
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf dist/${{ matrix.asset }} TeXLoom
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v') && !startsWith(github.ref, 'refs/tags/vscode-')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: out/*
          generate_release_notes: true
