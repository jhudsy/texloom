# The checks, on every push to main and every pull request: translations, the clients that must
# agree with each other (project lists, cross-references), the web app's own checks, and
# sync-only projects between two computers (scripts/check_synconly.py), on each operating system:
# the script simulates Windows and Unix line endings, and the Windows runner adds a real Windows.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv run python scripts/check_i18n.py
      - run: uv run python scripts/check_listsync.py
      - run: uv run python scripts/check_xr.py
      - name: Web app
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run check-i18n
          npm run check-listsync
          npm run check-versions
          npm run check-suggest
          npm run check-xr

  sync-only:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run python scripts/check_synconly.py
        env:
          CHECK_DIR: ${{ runner.temp }}/synconly
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: synconly-${{ matrix.os }}
          path: ${{ runner.temp }}/synconly
