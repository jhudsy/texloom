# The quick checks, on every push to main and every pull request: translations, the clients that
# must agree with each other (project lists, cross-references, merging), the web app's own checks,
# property checks with random texts and edits, and that positions in texts can't be mixed up. The
# longer end-to-end check of sync-only projects is in sync-only.yml.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv run --locked python scripts/check_version.py  # --locked: a uv.lock behind pyproject.toml fails rather than being updated
      - name: No error swallowed without a trace (issue #24)
        run: uv run python scripts/check_quiet.py
      - run: uv run python scripts/check_i18n.py
      - run: uv run python scripts/check_listsync.py
      - run: uv run python scripts/check_xr.py
      - run: uv run python scripts/check_packing.py
      - name: The desktop's replica against the cases the web app's is checked against (issue #26)
        run: uv run python scripts/check_replica.py
      - run: uv run python scripts/check_folder_deletions.py
      - run: uv run python scripts/check_folder_reads.py
      - run: uv run python scripts/check_folder_renames.py
      - name: The example settings file matches the server's settings
        run: uv run --extra server python scripts/check_config.py
      - name: The server's file store (a folder, with a throwaway PostgreSQL; S3 is checked locally against Garage)
        run: uv run --extra server python scripts/check_files.py folder
      - name: Moving a project to another creation code (a real server, with a throwaway PostgreSQL)
        run: uv run --extra server python scripts/check_move_code.py
      - name: Comments for a synced folder (the overview, texloom comments; a real server)
        run: uv run --extra server python scripts/check_comments.py
      - name: The comments language server (texloom lsp; a real server)
        run: uv run --extra server python scripts/check_lsp.py
      - name: Positions can't be mixed up (textpos, mypy)
        run: uv run --with mypy python scripts/check_textpos.py
      - name: Web app
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run check-i18n
          npm run check-listsync
          npm run check-versions
          npm run check-suggest
          npm run check-pdfanchor
          npm run check-xr
          npm run check-packing
          npm run check-replica
          npm run check-chars
          npm run check-props
          npm run check-folder-model
          npm run check-submission
          npm run check-mcpclient
          npm run check-gitshacache
      - name: Property checks of the desktop's text handling, and the same rules as the web app
        run: uv run --with hypothesis python scripts/check_props.py
      - name: Model-based check of the desktop's folder sync (two computers and a collaborator, random steps)
        run: uv run --with hypothesis python scripts/check_folder_model.py
