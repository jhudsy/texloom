# The quick checks, on every push to main and every pull request: translations, the clients that
# must agree with each other (project lists, cross-references, merging), the web app's own checks,
# property checks with random texts and edits, and that positions in texts can't be mixed up. The
# longer end-to-end check of sync-only projects is in sync-only.yml.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv run python scripts/check_i18n.py
      - run: uv run python scripts/check_listsync.py
      - run: uv run python scripts/check_xr.py
      - name: Positions can't be mixed up (textpos, mypy)
        run: uv run --with mypy python scripts/check_textpos.py
      - name: Web app
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run check-i18n
          npm run check-listsync
          npm run check-versions
          npm run check-suggest
          npm run check-xr
          npm run check-chars
          npm run check-props
      - name: Property checks of the desktop's text handling, and the same rules as the web app
        run: uv run --with hypothesis python scripts/check_props.py
