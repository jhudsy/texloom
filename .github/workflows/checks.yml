# The quick checks, on every push to main and every pull request: translations, the clients that
# must agree with each other (project lists, cross-references) and the web app's own checks. The
# longer end-to-end check of sync-only projects is in sync-only.yml.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: uv run python scripts/check_i18n.py
      - run: uv run python scripts/check_listsync.py
      - run: uv run python scripts/check_xr.py
      - name: Web app
        working-directory: web
        run: |
          npm ci
          npx tsc --noEmit -p .
          npm run check-i18n
          npm run check-listsync
          npm run check-versions
          npm run check-suggest
          npm run check-xr
          npm run check-chars
