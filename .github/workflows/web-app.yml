# The web app in a real browser (headless Chromium), through its own screens: keeping a project in
# step with GitHub, GitLab and Gitea repositories and a Dropbox folder (stand-ins), and the Review
# tab (comment order, several drafts at once). About three minutes, so it runs when the web app or
# the server changes, every night, and on demand (Actions → Web app check → Run workflow).
name: Web app check

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'server/**'
      - 'scripts/webcheck.py'
      - 'scripts/check_web_*.py'
      - 'scripts/fakeforge.py'
      - 'scripts/fakedropbox.py'
      - 'scripts/pg.py'
      - '.github/workflows/web-app.yml'
  pull_request:
    paths:
      - 'web/**'
      - 'server/**'
      - 'scripts/webcheck.py'
      - 'scripts/check_web_*.py'
      - 'scripts/fakeforge.py'
      - 'scripts/fakedropbox.py'
      - 'scripts/pg.py'
      - '.github/workflows/web-app.yml'
  schedule:
    - cron: '47 3 * * *'  # nightly
  workflow_dispatch:

jobs:
  web-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the web app (the server serves it)
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: PostgreSQL's programs (scripts/pg.py runs a throwaway one)
        run: ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1 || sudo apt-get install -y postgresql
      - name: Chromium
        id: chromium
        # Ubuntu's package mirrors are sometimes unreachable for a while: try again before failing
        run: |
          for i in 1 2 3; do
            uv run --with playwright python -m playwright install --with-deps chromium && exit 0
            echo "Chromium install failed (attempt $i); trying again in a minute"; sleep 60
          done
          exit 1
      - name: Keeping a project in step with a git repository (GitHub, GitLab, Gitea)
        run: uv run --extra server --with playwright python scripts/check_web_git.py
      - name: Keeping a project in step with a Dropbox folder
        if: (success() || failure()) && steps.chromium.outcome == 'success'
        run: uv run --extra server --with playwright python scripts/check_web_dropbox.py
      - name: The Review tab
        if: (success() || failure()) && steps.chromium.outcome == 'success'  # even if the one above failed
        run: uv run --extra server --with playwright python scripts/check_web_review.py
