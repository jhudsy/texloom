# The workflow files themselves (scripts/check_workflows.py): a file that doesn't parse isn't reported as
# a failing test, its workflow just doesn't run. Its own workflow, so that it runs when another is the
# one that is broken.
name: Workflow files
on:
  push:
    branches: [main]
    paths:
      - '.github/**'
      - 'scripts/check_workflows.py'
  pull_request:
    paths:
      - '.github/**'
      - 'scripts/check_workflows.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - run: uv run --with pyyaml python scripts/check_workflows.py
