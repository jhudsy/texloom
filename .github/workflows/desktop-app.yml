# The desktop app's windows (scripts/check_app.py, issue #25): its main window and dialogs open and
# close, a dialog asked for from another opens over it, and on macOS the menu-bar and Dock fixes,
# which rely on undocumented AppKit and Qt behaviour, still hold. Offscreen on Linux and Windows,
# with the real menu bar on macOS. When the app changes, and every week: a new macOS runner image
# or Qt release can break the Mac fixes with no change here.
name: Desktop app check

on:
  push:
    branches: [main]
    paths:
      - 'texloom/**'
      - 'scripts/check_app.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop-app.yml'
      - '.github/actions/qt-libs/**'
  pull_request:
    paths:
      - 'texloom/**'
      - 'scripts/check_app.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/desktop-app.yml'
      - '.github/actions/qt-libs/**'
  schedule:
    - cron: '41 4 * * 1'  # Mondays
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: ./.github/actions/qt-libs
      - name: Windows and dialogs (offscreen)
        run: uv run --extra app python scripts/check_app.py
      - name: The MCP server over standard input and output
        run: uv run python scripts/check_bundled_mcp.py texloom
      - name: The menu bar and the Dock (macOS)
        if: runner.os == 'macOS'
        run: uv run --extra app python scripts/check_app.py --native
