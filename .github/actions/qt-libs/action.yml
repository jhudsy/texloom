name: Qt's system libraries
description: The system libraries Qt (PySide6) needs on Linux; nothing on other systems.
runs:
  using: composite
  steps:
    - name: Qt's system libraries (Linux)
      if: runner.os == 'Linux'
      shell: bash
      # kernel.org's Ubuntu mirror rather than the runner's mirror list: ubuntu.com's DNS has had
      # outages that took the Azure mirror and the archive down together. And a few tries.
      run: |
        sudo grep -rlE 'mirror\+file:|ubuntu\.com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null \
          | xargs -r sudo sed -i -E 's#mirror\+file:/etc/apt/apt-mirrors.txt/?|https?://[a-z.]*ubuntu\.com/ubuntu/?#https://mirrors.edge.kernel.org/ubuntu/#g'
        for i in 1 2 3; do
          sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install -y -o Acquire::Retries=3 \
            libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 && exit 0
          sleep 30
        done
        exit 1
