# The front door of scripts/rehearse_relays.py (a rehearsal in Docker, not for production): one nginx in
# front of every relay, as production runs nginx. Any relay will do for any request. WebSockets last long,
# so a new connection goes to the relay with the fewest (least_conn).
#
# nginx (without its commercial edition) checks health passively: a relay that fails to connect within
# proxy_connect_timeout, or to answer within proxy_read_timeout, is left out for fail_timeout, and the
# request is tried on another. After fail_timeout one request tries it again. The script puts the relays'
# addresses in place of RELAYS (fixed addresses: nginx looks names up only when it starts).
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
	worker_connections 4096;
}

http {
	access_log off;

	map $http_upgrade $connection_upgrade {
		default upgrade;
		""      close;
	}

	upstream relays {
		least_conn;
		RELAYS
	}

	server {
		listen 8080;
		client_max_body_size 75m;

		proxy_http_version 1.1;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_connect_timeout 2s;
		proxy_next_upstream error timeout;
		proxy_next_upstream_tries 3;
		proxy_next_upstream_timeout 15s;
		# which relays were tried, the one that answered last, for the rehearsal to see
		add_header X-Relay $upstream_addr always;

		# the apps' WebSockets: long-lived; the apps' own keep-alive notices a relay that stops answering
		location /ws/ {
			proxy_pass http://relays;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection $connection_upgrade;
			proxy_read_timeout 1h;
			proxy_send_timeout 1h;
		}

		# everything else answers quickly: a relay that doesn't within 10 s is taken as failed
		location / {
			proxy_pass http://relays;
			proxy_set_header Connection "";
			proxy_read_timeout 10s;
		}
	}
}
